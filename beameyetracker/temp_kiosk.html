
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>노인용 키오스크</title>
            <style>
                body {
                    font-family: 'Malgun Gothic', sans-serif;
                    margin: 0;
                    padding: 20px;
                    background: #f5f5f5;
                }
                .kiosk-container {
                    max-width: 800px;
                    margin: 0 auto;
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                }
                .header {
                    text-align: center;
                    margin-bottom: 30px;
                }
                .header h1 {
                    color: #333;
                    font-size: 28px;
                    margin-bottom: 10px;
                }
                .menu-grid {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 20px;
                    margin-bottom: 30px;
                }
                .menu-item {
                    background: #4CAF50;
                    color: white;
                    padding: 25px;
                    border-radius: 10px;
                    text-align: center;
                    cursor: pointer;
                    font-size: 18px;
                    transition: all 0.3s;
                }
                .menu-item:hover {
                    background: #45a049;
                    transform: scale(1.05);
                }
                .menu-item.selected {
                    background: #ff6b6b;
                }
                .order-summary {
                    background: #f9f9f9;
                    padding: 20px;
                    border-radius: 10px;
                    margin-bottom: 20px;
                }
                .order-summary h3 {
                    margin-top: 0;
                    color: #333;
                }
                .payment-buttons {
                    display: flex;
                    gap: 15px;
                    justify-content: center;
                }
                .payment-btn {
                    padding: 15px 30px;
                    font-size: 16px;
                    border: none;
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.3s;
                }
                .payment-btn.primary {
                    background: #2196F3;
                    color: white;
                }
                .payment-btn.secondary {
                    background: #ff9800;
                    color: white;
                }
                .payment-btn:hover {
                    transform: scale(1.05);
                }
                .price {
                    font-size: 24px;
                    font-weight: bold;
                    color: #333;
                    text-align: center;
                    margin: 20px 0;
                }
            </style>
        </head>
        <body>
            <div class="kiosk-container">
                <div class="header">
                    <h1>☕ 커피 키오스크</h1>
                    <p>원하시는 메뉴를 선택해주세요</p>
                </div>
                
                <div class="menu-grid">
                    <div class="menu-item" onclick="selectMenu('아메리카노', 4500)">
                        ☕ 아메리카노<br>
                        <small>4,500원</small>
                    </div>
                    <div class="menu-item" onclick="selectMenu('카페라떼', 5000)">
                        🥛 카페라떼<br>
                        <small>5,000원</small>
                    </div>
                    <div class="menu-item" onclick="selectMenu('카푸치노', 5500)">
                        ☕ 카푸치노<br>
                        <small>5,500원</small>
                    </div>
                    <div class="menu-item" onclick="selectMenu('에스프레소', 3500)">
                        ☕ 에스프레소<br>
                        <small>3,500원</small>
                    </div>
                </div>
                
                <div class="order-summary" id="orderSummary" style="display: none;">
                    <h3>📋 주문 내역</h3>
                    <div id="orderItems"></div>
                    <div class="price" id="totalPrice"></div>
                </div>
                
                <div class="payment-buttons" id="paymentButtons" style="display: none;">
                    <button class="payment-btn primary" onclick="pay()">💳 카드 결제</button>
                    <button class="payment-btn secondary" onclick="pay()">📱 모바일 결제</button>
                </div>
            </div>
            
            <script>
                let selectedItems = [];
                let totalAmount = 0;
                
                function selectMenu(name, price) {
                    selectedItems.push({name, price});
                    totalAmount += price;
                    updateOrderSummary();
                    
                    // 선택된 메뉴 하이라이트
                    document.querySelectorAll('.menu-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    event.target.classList.add('selected');
                }
                
                function updateOrderSummary() {
                    const summary = document.getElementById('orderSummary');
                    const items = document.getElementById('orderItems');
                    const total = document.getElementById('totalPrice');
                    const buttons = document.getElementById('paymentButtons');
                    
                    items.innerHTML = selectedItems.map(item => 
                        `<div>${item.name} - ${item.price.toLocaleString()}원</div>`
                    ).join('');
                    
                    total.textContent = `총 금액: ${totalAmount.toLocaleString()}원`;
                    summary.style.display = 'block';
                    buttons.style.display = 'flex';
                }
                
                function pay() {
                    alert('결제가 완료되었습니다! 감사합니다.');
                    // 주문 초기화
                    selectedItems = [];
                    totalAmount = 0;
                    document.getElementById('orderSummary').style.display = 'none';
                    document.getElementById('paymentButtons').style.display = 'none';
                    document.querySelectorAll('.menu-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                }
            </script>
        </body>
        </html>
