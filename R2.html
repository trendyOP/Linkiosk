    .progress-step.done { color:#3b1e6d; }
    .progress-step:not(:last-child)::after { content:'>'; color:#bbb; margin-left:22px;}

    .sidebar { width:190px; background:#f7f7f7; border-radius:14px; border:2px solid #eee; display:flex; flex-direction:column; align-items:center; padding-top:40px; }
    .sidecat { display:flex; flex-direction:column; align-items:center; width:100%; }
    .sidecat-btn { width:150px; margin-bottom:10px; padding:20px 0; text-align:center; background:none; border:none; font-size:1.13em; color:#444; font-weight:bold; cursor:pointer; border-left:5px solid transparent; transition:background 0.2s, border 0.2s; border-radius:12px;}
    .sidecat-btn.active { background:#fff; border-left:5px solid #3b1e6d; color:#3b1e6d;}
    .menu-panel { flex:1; max-width:650px; display:flex; flex-direction:column; align-items:center; }
    .main-title { font-size:1.28em; color:#3b1e6d; font-weight:bold; margin-bottom:22px; text-align:center; width:100%;}
    .product-grid { display: grid; grid-template-columns: repeat(3, 189px); gap: 22px; justify-content: center; width: 100%;}
    .product-card {
      width: 189px; height: 207px;
      background: #f8f8ff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: box-shadow 0.2s, border 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px 6px 8px;
      box-sizing: border-box;
      overflow: hidden;
      justify-content: flex-start;
    }
    .product-card.selected, .product-card:active { border:2.5px solid #3b1e6d; box-shadow:0 4px 16px rgba(59,30,109,0.11);}
    .product-img-placeholder {
      width: 110px; height: 110px;
      background: #e0e0e0;
      border-radius: 8px;
      margin-bottom: 7px;
      flex-shrink: 0;
      flex-grow: 0;
    }
    .product-name {
      font-size: 1.02em;
      font-weight: bold;
      color: #222;
      margin-bottom: 4px;
      white-space: normal;
      line-height: 1.2;
      width: 100%;
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
      flex-shrink: 0;
      min-height: 2.4em;
      max-height: 3.6em;
      overflow: hidden;
    }
    .product-price {
      color: #e53935;
      font-size: 1.05em;
      font-weight: bold;
      margin-bottom: 2px;
      width: 100%;
      text-align: center;
      flex-shrink: 0;
    }
    .order-section-wrap { width:100%; margin-top:30px; display:flex; justify-content:center;}
    .order-section { width:calc(100% - 72px); background:#f7f7f7; border-radius:14px; border:2px solid #eee; padding:20px 24px 32px 24px; box-sizing:border-box; }
    .order-title { font-weight:bold; font-size:1.2em; color:#3b1e6d; margin-bottom:12px; text-align:center; }
    .order-list-bar { display:flex; flex-wrap:wrap; gap:15px; justify-content:center; max-height:200px; overflow-y:auto; padding-right:8px;}
    .order-item-bar { background:#fff; border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:8px; font-size:1.08em; box-shadow:0 1px 4px rgba(0,0,0,0.04); min-width:180px;}
    .order-name-bar { min-width:90px; white-space:normal; line-height:1.2; text-align:center; font-weight:600;}
    .order-qty-bar { width:28px; text-align:center; font-weight:bold;}
    .order-price-bar { width:70px; text-align:right; color:#e53935; font-weight:bold;}
    .order-remove-bar { background:none; border:none; color:#aaa; font-size:1.3em; cursor:pointer; margin-left:4px; transition:color 0.2s;}
    .order-remove-bar:hover { color:#e53935;}
    .order-sum-bar { font-size:1.13em; font-weight:bold; color:#3b1e6d; margin-top:14px; text-align:center;}
    .order-bottom-btns { display:flex; justify-content:center; gap:30px; margin-top:24px; }
    .order-bottom-btns button { padding:16px 40px; font-size:1.1em; border:none; border-radius:12px; font-weight:bold; cursor:pointer; background:#3b1e6d; color:#fff; transition:background 0.2s;}
    .order-bottom-btns button:first-child { background:#aaa; color:#fff; }
    .order-bottom-btns button:active { background:#a084ca;}
    .centered-msg { text-align:center; color:#aaa; margin:30px 0;}
    /* 맛 선택 모달 */
    .modal-bg { position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.23); z-index:100; display:none; align-items:center; justify-content:center;}
    .modal {
      background:#fff;
      border-radius:18px;
      padding:30px 30px 24px 30px;
      text-align:center;
      box-shadow:0 8px 32px rgba(0,0,0,0.13);
      width: 430px;
      max-width: 95vw;
    }
    .flavor-modal-title { font-size:1.2em; color:#3b1e6d; font-weight:bold; margin-bottom:18px;}
    .flavor-scroll-wrap {
      height: 400px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .flavor-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 0 0 0 0;
    }
    .flavor-card {
      background: #f8f8ff;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 1.08em;
      color: #3b1e6d;
      padding: 10px 6px 6px 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .flavor-img-placeholder {
      width: 70px;
      height: 70px;
      background: #e0e0e0;
      border-radius: 7px;
      margin-bottom: 8px;
    }
    .flavor-card.selected {
      border: 2.5px solid #3b1e6d;
      background: #e2dbfa;
    }
    .flavor-selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 14px 0 0 0;
    }
    .flavor-selected-item {
      background: #e2dbfa;
      color: #3b1e6d;
      border-radius: 7px;
      padding: 6px 13px;
      font-size: 1em;
      cursor:pointer;
    }
    .modal-bottom-btns {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }
    .modal-bottom-btns button {
      padding: 14px 32px;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      background: #3b1e6d;
      color: #fff;
    }
    .modal-bottom-btns button:active {
      background: #a084ca;
    }
    /* 주문확인/할인/결제 화면 */
    .step-panel { width:100%; max-width:700px; margin:0 auto 40px auto; background:#f8f8ff; border-radius:18px; box-shadow:0 2px 8px rgba(0,0,0,0.07); padding:34px 32px 32px 32px; }

    .step-btns { display:flex; justify-content:center; gap:24px; margin-top:22px;}
    .step-btns button { padding:14px 36px; font-size:1.1em; border-radius:10px; border:none; background:#3b1e6d; color:#fff; font-weight:bold; cursor:pointer;}

    .step-btns button:active { background:#a084ca;}
    .step-sum { margin-top:22px; text-align:center; font-size:1.15em;}
    .step-sum b { color:#e53935;}
    .step-sum-row { display:flex; justify-content:space-between; margin:10px 0 0 0;}
    .step-sum-row b { color:#e53935;}

    .big-btn-grid {

      grid-template-columns: repeat(2, 227px);
      grid-gap: 32px 36px;
      justify-content: center;
      margin-bottom: 32px;

    .big-btn {

      height: 227px;

      border: 3px solid #b8a4e8;
      border-radius: 18px;
      font-size: 2.1em;
      font-weight: bold;
      color: #3b1e6d;

    .modal.big {

    .modal.big .step-title {
      font-size: 2.5em; /* 기존 1.3em에서 대폭 확대 */
      font-weight: bold;
      color: #3b1e6d;
      margin-bottom: 28px;
      text-align: center;
    }
    @media (max-width: 900px) {
      .kiosk-wrap { width:100vw; }
      .order-section { width:96vw; }
      .modal { width:96vw; }
      .modal.big { width:96vw; min-width:0; height:90vw; min-height:200px;}
      .big-btn-grid { grid-template-columns: 1fr 1fr; }
      .big-btn { width: 44vw; height: 44vw; min-width:120px; min-height:120px; font-size:1.2em;}

</head>

    // 맛 선택 모달
    function showFlavorModal(item, qty, cupType) {
      qty = qty || 1;
      const modalBg = document.getElementById('flavor-modal-bg');
      modalBg.style.display = "flex";
      let selected = [];
      function renderFlavors() {
        document.getElementById('flavor-grid').innerHTML = flavorList.map(f =>
          `<div class="flavor-card${selected.filter(x=>x===f).length?' selected':''}" data-name="${f}">
            <div class="flavor-img-placeholder"></div>
            <div>${f}</div>
          </div>`
        ).join('');
        document.getElementById('flavor-count').innerHTML =
          `선택: <b style="color:#3b1e6d;">${selected.length}</b>/${item.flavors?item.flavors*qty:qty}`;
        document.getElementById('flavor-selected-list').innerHTML =
          selected.map((f,i)=>`<div class="flavor-selected-item" data-idx="${i}">${f}</div>`).join('');
        document.querySelectorAll('.flavor-card').forEach(btn=>{
          btn.onclick = ()=>{
            let limit = item.flavors?item.flavors*qty:qty;
            if(selected.length<limit) selected.push(btn.dataset.name);
            renderFlavors();
          };
        });
        document.querySelectorAll('.flavor-selected-item').forEach(sel=>{
          sel.onclick = ()=>{
            selected.splice(Number(sel.dataset.idx),1);
            renderFlavors();
          }
        });
      }
      renderFlavors();
      document.getElementById('flavor-ok-btn').onclick = ()=>{
        let limit = item.flavors?item.flavors*qty:qty;
        if(selected.length!==limit){
          alert(`맛을 ${limit}개 선택해 주세요!`);
          return;
        }
        if(item.cupcone){
          addToCart({...item, qty, cupType, flavorsSelected: selected.slice()});
        }else{
          addToCart({...item, qty:1, flavorsSelected: selected.slice()});
        }
        modalBg.style.display = "none";
        renderMenu();
      };
      document.getElementById('flavor-cancel-btn').onclick = ()=>{
        modalBg.style.display = "none";
      };
    }

    // 컵/콘 선택 모달
    function showCupConeModal(item) {
      const modalBg = document.getElementById('cupcone-modal-bg');
      modalBg.style.display = "flex";
      let selectedType = null;
      document.querySelectorAll('.cupcone-btn-modal').forEach(btn=>{
        btn.classList.remove('active');
        btn.onclick = ()=>{
          document.querySelectorAll('.cupcone-btn-modal').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          selectedType = btn.dataset.type;
          modalBg.style.display = "none";
          showFlavorModal(item, 1, selectedType);
        };
      });
      document.getElementById('cupcone-cancel-btn').onclick = ()=>{
        modalBg.style.display = "none";
      };
    }

    function addToCart(item) {
      let key = item.id;
      if(item.cupType) key += "|" + item.cupType;
      if(item.flavorsSelected) key += "|" + item.flavorsSelected.join(",");
      let found = cart.find(x => {
        if(x.id!==item.id) return false;
        if(item.cupType && x.cupType!==item.cupType) return false;
        if(item.flavorsSelected) return JSON.stringify(x.flavorsSelected)===JSON.stringify(item.flavorsSelected);
        return true;
      });
      if(found) found.qty+=item.qty||1;
      else cart.push({ ...item });
      renderCartBar();
    }

    function renderCartBar() {
      const list = document.getElementById('order-list-bar');
      if (!list) return;
      if (cart.length === 0) {
        list.innerHTML = `<div class="centered-msg">주문 내역이 없습니다.</div>`;
      } else {
        list.innerHTML = cart.map(item => `
          <div class="order-item-bar">
            <span class="order-name-bar">${item.name}${item.cupType?`<br><span style='font-size:0.95em;color:#888;'>${item.cupType==="cup"?"컵":"콘"}</span>`:""}${item.flavorsSelected ? "<br><span style='font-size:0.93em;color:#888;'>"+item.flavorsSelected.join(", ")+"</span>" : ""}</span>
            <span class="order-qty-bar">${item.qty||1}</span>
            <span class="order-price-bar">${((item.price) * (item.qty||1)).toLocaleString()}원</span>
            <button class="order-remove-bar" data-id="${item.id}" data-cup="${item.cupType||""}" data-flavors="${item.flavorsSelected?item.flavorsSelected.join(","):""}" title="삭제">&#128465;</button>
          </div>
        `).join('');
      }
      document.querySelectorAll('.order-remove-bar').forEach(btn => {
        btn.onclick = () => {
          const id = Number(btn.dataset.id);
          const cupType = btn.dataset.cup;
          const flavors = btn.dataset.flavors;
          cart = cart.filter(x => {
            if(x.id!==id) return true;
            if(x.cupType && x.cupType!==cupType) return true;
            if(x.flavorsSelected) return x.flavorsSelected.join(",")!==flavors;
            return false;
          });
          renderCartBar();
        };
      });
      const sumBar = document.getElementById('order-sum-bar');
      if(sumBar) sumBar.textContent = `합계: ${cart.reduce((a,b)=>a+b.price*(b.qty||1),0).toLocaleString()}원`;
    }
  </script>
</body>
</html>
